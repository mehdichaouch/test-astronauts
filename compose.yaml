services:
  db:
    image: postgres:alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - ./apps/backend/src/init.sql:/docker-entrypoint-initdb.d/init.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: .
      dockerfile: containers/Containerfile
      target: backend-development 
    depends_on:
      db:
        condition: service_healthy  
    environment:
      - PORT=4000
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
    ports:
      - 4000:4000
    volumes:
      - ./apps/backend:/workspace/apps/backend:delegated
      - ./packages/core:/workspace/packages/core:delegated
      - /workspace/apps/backend/node_modules
  frontend:
    build:
      context: .
      dockerfile: containers/Containerfile
      target: frontend-development 
    environment:
      - VITE_API_URL=http://localhost:4000
    ports:
      - 3000:5173
    volumes:
      - ./apps/frontend:/workspace/apps/frontend:delegated
      - ./packages/core:/workspace/packages/core:delegated
      - /workspace/apps/frontend/node_modules